services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: streammark-livekit
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    networks:
      - streammark_net
    # LiveKit's livekit.yaml is configured for a single-port setup (tcp_port
    # 7881, udp_port 7882), which is friendly to Docker port publishing. This
    # is why we can afford to run it in bridge mode instead of host networking
    # -- there's no huge UDP range to publish.
    ports:
      - "7880:7880"       # WS/HTTP signaling
      - "7881:7881"       # TCP fallback for RTC
      - "7882:7882/udp"   # RTC media (single UDP port per livekit.yaml)
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      # livekit-server's Alpine base image ships wget, not curl.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7880/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    # Pinned below mongo:8: mongo:8's tcmalloc does a hard CHECK on cgroup cpuset info that
    # crashes (SIGSEGV / exit 139) under some nested/restricted container runtimes where that
    # info isn't exposed. mongo:6 has no such check. Bump back to :8 if your Docker host has
    # full cgroup access and you've confirmed it starts cleanly there.
    image: mongo:6
    container_name: streammark-mongo
    restart: unless-stopped
    networks:
      - streammark_net
    # Intentionally no published ports: mongo is only reachable from other services
    # on the bridge network as `mongo:27017`. Publish it explicitly if you want to
    # connect from the host with mongosh.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: streammark-api
    restart: unless-stopped
    networks:
      - streammark_net
    ports:
      # Bind to 0.0.0.0:8000 so browsers on other LAN devices can reach the API
      # at http://<host-lan-ip>:8000.
      - "8000:8000"
    env_file: .env
    # MONGODB_URI: rewritten to the bridge service name (only used server-side).
    # LIVEKIT_URL_INTERNAL: what THIS container uses for server-to-server calls
    # to livekit. Docker Desktop can't route from containers to the host's LAN
    # IP, but sibling containers are reachable by service name. LIVEKIT_URL
    # (from .env) is what the api hands to browsers and must be LAN-reachable.
    environment:
      MONGODB_URI: mongodb://mongo:27017
      LIVEKIT_URL_INTERNAL: ws://livekit:7880
    depends_on:
      livekit:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: docker/frontend.Dockerfile
      args:
        # Vite inlines this at build time, so the compiled bundle is pinned to
        # whatever URL you build with. For LAN access from other devices, set
        # this to the host's LAN IP (e.g. `VITE_API_BASE_URL=http://192.168.1.2:8000
        # docker compose build frontend`). Defaults to localhost so a plain
        # `docker compose up --build` at least works from the host itself.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://192.168.0.101:8000}
    container_name: streammark-frontend
    restart: unless-stopped
    networks:
      - streammark_net
    ports:
      # nginx binds to 5173 inside the container (not :80 -- rootless Docker
      # can't bind privileged ports); publish it on the host's :5173.
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  # One-shot dev convenience: creates a demo host account + a live 'demo-room' so `docker
  # compose up` gives you something to look at immediately. Idempotent (scripts/seed_demo_room.py
  # tolerates the account/room already existing), so it's safe on every `up`, not just the first.
  seed:
    image: python:3.12-slim
    container_name: streammark-seed
    # Share the api service's network namespace so the script's hardcoded
    # `http://localhost:8000` resolves to the api process without modification.
    network_mode: "service:api"
    env_file: .env
    volumes:
      - ./scripts/seed_demo_room.py:/seed_demo_room.py:ro
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "/seed_demo_room.py"]
    restart: "no"

networks:
  streammark_net:
    driver: bridge

volumes:
  mongo-data:

# The ingest service intentionally is NOT defined here by default. It needs direct
# access to the capture card's /dev/videoN device node, so it should run natively on
# the capture host:
#
#   streammark-ingest --room <name> --device /dev/video0
#
# Opt-in containerized fallback, if you must containerize it (adjust device path):
