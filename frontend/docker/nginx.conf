server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side routes (/dashboard, /room/:id, ...) that don't exist as
    # files -- fall back to index.html so a hard refresh/direct link doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
