[project]
name = "streammark-webserver"
version = "0.1.0"
description = "FastAPI room/token/auth service for StreamMark, plus its DB-backed tools (logger-bot, token minting)"
requires-python = ">=3.12"
dependencies = [
    "streammark-shared",
    "livekit==1.1.13",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.0",
    "motor==3.7.1",
    "bcrypt==5.0.0",
    "PyJWT==2.13.0",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "mongomock-motor==0.0.36",
]

[project.scripts]
streammark-api = "streammark_webserver.api.__main__:main"
streammark-logger-bot = "streammark_webserver.tools.logger_bot:cli"
streammark-mint-token = "streammark_webserver.tools.mint_publisher_token:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
