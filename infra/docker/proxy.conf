# Single entry point for both the frontend and the API. streammark-api's
# routes live at its own root (/auth, /rooms, /healthz -- see
# backend-webserver/src/streammark_webserver/api/app.py), so /api/ is
# stripped before forwarding (trailing slash on both location and proxy_pass).
#
# Listens on 8080, not 80: rootless Docker can't bind <1024 inside the
# container. Host-side, docker-compose.yml maps the public :80 to this 8080.
server {
    listen 8080;
    server_name _;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
