services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: streammark-livekit
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    networks:
      - streammark_net
    # LiveKit's livekit.yaml is configured for a single-port setup (tcp_port
    # 7881, udp_port 7882), which is friendly to Docker port publishing. This
    # is why we can afford to run it in bridge mode instead of host networking
    # -- there's no huge UDP range to publish.
    ports:
      - "7880:7880"       # WS/HTTP signaling
      - "7881:7881"       # TCP fallback for RTC
      - "7882:7882/udp"   # RTC media (single UDP port per livekit.yaml)
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      # livekit-server's Alpine base image ships wget, not curl.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7880/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    # Pinned below mongo:8: mongo:8's tcmalloc does a hard CHECK on cgroup cpuset info that
    # crashes (SIGSEGV / exit 139) under some nested/restricted container runtimes where that
    # info isn't exposed. mongo:6 has no such check. Bump back to :8 if your Docker host has
    # full cgroup access and you've confirmed it starts cleanly there.
    image: mongo:6
    container_name: streammark-mongo
    restart: unless-stopped
    networks:
      - streammark_net
    # Intentionally no published ports: mongo is only reachable from other services
    # on the bridge network as `mongo:27017`. Publish it explicitly if you want to
    # connect from the host with mongosh.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Built by .github/workflows/docker-build.yml and published as a package
    # of this repo. Override with API_IMAGE in .env to pin a specific tag
    # (e.g. a version tag instead of :latest). If the GHCR package is
    # private, `docker login ghcr.io` on this box first or make it public.
    image: ${API_IMAGE:-ghcr.io/sayan24/local-streamer-backend:latest}
    # Without this, compose only pulls when the image is missing locally --
    # it won't notice a newer `latest` was published. Always check instead.
    pull_policy: always
    container_name: streammark-api
    restart: unless-stopped
    networks:
      - streammark_net
    # No host port published: browsers reach this through the proxy service's
    # /api/ route instead (see docker/proxy.conf), not directly.
    env_file: .env
    # MONGODB_URI: rewritten to the bridge service name (only used server-side).
    # LIVEKIT_URL_INTERNAL: what THIS container uses for server-to-server calls
    # to livekit. Docker Desktop can't route from containers to the host's LAN
    # IP, but sibling containers are reachable by service name. LIVEKIT_URL
    # (from .env) is what the api hands to browsers and must be LAN-reachable.
    environment:
      MONGODB_URI: mongodb://mongo:27017
      LIVEKIT_URL_INTERNAL: ws://livekit:7880
    depends_on:
      livekit:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    # Built by .github/workflows/docker-build.yml and published as a package
    # of this repo. Override with FRONTEND_IMAGE in .env to pin a specific
    # tag. If the GHCR package is private, `docker login ghcr.io` on this box
    # first or make it public.
    image: ${FRONTEND_IMAGE:-ghcr.io/sayan24/local-streamer-frontend:latest}
    pull_policy: always
    container_name: streammark-frontend
    restart: unless-stopped
    networks:
      - streammark_net
    # No host port published: reached through the proxy service instead (see
    # docker/proxy.conf), which also puts it on the same origin as /api/ --
    # so the frontend's default same-origin API URL just works, no LAN IP
    # needed. VITE_API_BASE_URL in .env remains as an escape hatch (e.g. the
    # API is hosted elsewhere) but is unset/unused by default.
    environment:
      API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy

  # Single entry point for both the frontend and the API (backend under
  # /api/) -- see docker/proxy.conf. This is the only HTTP port meant to be
  # published to the LAN; api/frontend are reachable only inside the compose
  # network.
  proxy:
    image: nginx:alpine
    container_name: streammark-proxy
    restart: unless-stopped
    networks:
      - streammark_net
    ports:
      # Not :80 -- rootless Docker can't bind privileged ports (same
      # reasoning as frontend's own nginx; see frontend/docker/nginx.conf).
      - "8080:8080"
    volumes:
      - ./docker/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy

  # One-shot dev convenience: creates a demo host account + a live 'demo-room' so `docker
  # compose up` gives you something to look at immediately. Idempotent (scripts/seed_demo_room.py
  # tolerates the account/room already existing), so it's safe on every `up`, not just the first.
  seed:
    image: python:3.12-slim
    container_name: streammark-seed
    # Share the api service's network namespace so the script's hardcoded
    # `http://localhost:8000` resolves to the api process without modification.
    network_mode: "service:api"
    env_file: .env
    volumes:
      - ./scripts/seed_demo_room.py:/seed_demo_room.py:ro
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "/seed_demo_room.py"]
    restart: "no"

networks:
  streammark_net:
    driver: bridge

volumes:
  mongo-data:

# The ingest service intentionally is NOT defined here: it needs direct access to
# the capture card's /dev/videoN device node, so it always runs natively on the
# capture host (see infra/scripts/start_capture.sh), never in a container:
#
#   streammark-ingest --room <name> --device /dev/video0
