[project]
name = "streammark-shared"
version = "0.1.0"
description = "Shared config, logging, and LiveKit token-minting code for StreamMark's backend-webserver and stream-publisher packages"
requires-python = ">=3.12"
dependencies = [
    "livekit-api==1.1.1",
    "livekit-protocol==1.1.18",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
